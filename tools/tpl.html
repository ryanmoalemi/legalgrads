<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff9f0;overflow-x:hidden}
body{font-family:'Red Hat Display',system-ui,sans-serif;color:#0d0f3a}
.stage{position:relative;width:100vw;margin:0 auto}
.stage>*{position:absolute}
.d{--u:calc(100vw/1536);height:calc(var(--u)*1024)}
.m{--u:calc(100vw/885);height:calc(var(--u)*1777);display:none}
@media (max-width:700px){.d{display:none}.m{display:block}}
img{display:block}
.h1{font-weight:900;letter-spacing:0;white-space:nowrap;color:#0d0f3a}
.gt{background:linear-gradient(90deg,#8c08e6 0%,#b806c0 22%,#f2056e 42%,#fb0b5c 55%,#fc3e22 75%,#fd4f10 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.ul,.nsu{position:relative;display:inline-block}
.ul i,.nsu i{position:absolute;left:-2%;width:104%;background:#8a0aee;border-radius:50%/100%;transform:rotate(-1deg)}
.sub{color:#5a5f80;font-weight:400;letter-spacing:-.01em;white-space:nowrap}
.sf{background:#fff;border-radius:999px;box-shadow:0 6px 24px rgba(30,20,80,.08),0 1px 3px rgba(30,20,80,.06)}
.sf .mi{position:absolute;top:0;bottom:0;display:flex;align-items:center}.sf .mi svg{width:100%}
.sf input{position:absolute;top:0;bottom:0;border:0;outline:0;background:transparent;font:inherit;color:#0d0f3a}
.sf input::placeholder{color:#6f7395}
.sf button{position:absolute;border:0;border-radius:999px;background:#fc0273;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.sf button:hover{background:#e3006a}
.ns{color:#575d80;white-space:nowrap}
.err{color:#c0123d}
.ft h3{font-weight:800;color:#0d0f3a;white-space:nowrap}.ft p{color:#5b6180}
.ft.c{text-align:center}
.dv{background:#ece3d6}
.bg{border:0;background:none;cursor:pointer}
.cp{color:#9a9cb0}
.ty{position:absolute;inset:0;border-radius:999px;background:#fff;display:none;align-items:center;justify-content:center;font-weight:600}
.sf.done .ty{display:flex}
</style>
</head>
<body>
<main>
<div class="stage d">
%%D%%
</div>
<div class="stage m">
%%M%%
</div>
</main>
<script>
// TODO(signup backend): static hosting has no server. Replace this mailto fallback with a POST to a real signup service (Formspree, Buttondown, Mailchimp or a serverless function).
function ph(){document.querySelectorAll('.m input').forEach(function(i){i.placeholder=innerWidth<480?'Your email':'Drop your email for early access'})}ph();addEventListener('resize',ph);
document.querySelectorAll('.sf').forEach(function(f){
 var t=document.createElement('div');t.className='ty';t.setAttribute('role','status');t.textContent='🎉 Thanks! You\'re on the list.';f.appendChild(t);
 f.addEventListener('submit',function(e){e.preventDefault();
  var v=f.querySelector('input').value.trim(),err=f.parentNode.querySelector('.err');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){err.textContent='Please enter a valid email address.';return}
  err.textContent='';f.classList.add('done');
  location.href='mailto:hello@legalgrads.com?subject='+encodeURIComponent('Legalgrads early access')+'&body='+encodeURIComponent('Please add me to the Legalgrads early access list: '+v);
 });
});
</script>
</body>
</html>
