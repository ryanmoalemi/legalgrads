name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/test_import_idempotent.py
      - run: python3 scripts/test_suppression_published.py --data
      - run: python3 scripts/test_profile_favicon.py
      - run: python3 scripts/test_profile_place.py
      - run: python3 scripts/test_places.py
      - run: npm run build
      - run: python3 scripts/test_suppression_published.py --output out
      - run: npx playwright test
